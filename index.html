<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJ Crowd Screen — prototype</title>
<style>
  :root { --acc:#ff2d75; --bg:rgba(12,12,16,.82); --fg:#f2f2f5; --mut:#9a9aa8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; color:var(--fg);
    font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; text-align:center; padding:24px; background:#08080b; z-index:10; }
  #start h1 { margin:0; font-size:28px; letter-spacing:.04em; }
  #start p { margin:0; color:var(--mut); max-width:420px; }
  #err { color:#ff6b6b !important; }
  button { background:#24242c; color:var(--fg); border:1px solid #3a3a46; border-radius:8px;
    padding:8px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:#5a5a6a; }
  button.on { background:var(--acc); border-color:var(--acc); }
  #go { background:var(--acc); border:none; font-size:17px; padding:12px 28px; }
  #ui { position:fixed; left:12px; bottom:12px; width:min(460px, calc(100% - 24px));
    background:var(--bg); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid #2c2c36; border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px; z-index:5; }
  #ui[hidden] { display:none; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .lbl { color:var(--mut); font-size:12px; }
  #dot { width:14px; height:14px; border-radius:50%; background:#333; transition:background .05s; flex:none; }
  #dot.hit { background:var(--acc); box-shadow:0 0 12px var(--acc); }
  #status { flex:1; font-variant-numeric:tabular-nums; }
  #meter { position:relative; height:10px; background:#1a1a20; border-radius:5px; overflow:hidden; flex:1; }
  #meterFill { position:absolute; left:0; top:0; bottom:0; width:0; background:#5ad1a0; }
  #meterThr { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--acc); }
  input[type=range] { flex:1; accent-color:var(--acc); }
  input[type=number] { width:56px; background:#1a1a20; color:var(--fg); border:1px solid #3a3a46; border-radius:6px; padding:4px; font:inherit; }
  select { flex:1; min-width:0; background:#1a1a20; color:var(--fg); border:1px solid #3a3a46; border-radius:6px; padding:6px; font:inherit; }
  .grid { display:grid; grid-template-columns:auto 1fr auto; gap:6px 10px; align-items:center; }
  .val { width:44px; text-align:right; font-variant-numeric:tabular-nums; color:var(--mut); font-size:12px; }
  #hint { color:var(--mut); font-size:11px; }
  #showUi { position:fixed; right:10px; bottom:10px; z-index:4; opacity:.25; }
  #showUi:hover { opacity:1; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="start">
  <h1>DJ Crowd Screen</h1>
  <p>Prototype : flux caméra + effets qui réagissent au kick capté par le micro.</p>
  <button id="go">Démarrer</button>
  <p id="err"></p>
</div>

<button id="showUi" hidden>⚙︎</button>

<div id="ui" hidden>
  <div class="row">
    <div id="dot"></div>
    <div id="status">—</div>
  </div>
  <div class="row">
    <span class="lbl">Niveau</span>
    <div id="meter"><div id="meterFill"></div><div id="meterThr"></div></div>
  </div>
  <div class="row">
    <button id="bCam">Caméra ▶</button>
    <button id="bFx">Effet ▶</button>
    <button id="bTap">Tap kick</button>
    <button id="bMirror">Miroir</button>
    <button id="bFull">Plein écran</button>
    <button id="bHide">Masquer</button>
  </div>
  <div class="grid">
    <span class="lbl">Sensibilité</span><input id="sens" type="range" min="1.1" max="3" step="0.05" value="1.5"><span class="val" id="sensV"></span>
    <span class="lbl">Intensité</span><input id="amt" type="range" min="0.2" max="1.5" step="0.05" value="1"><span class="val" id="amtV"></span>
    <span class="lbl">Durée (ms)</span><input id="dur" type="range" min="80" max="700" step="10" value="260"><span class="val" id="durV"></span>
  </div>
  <div class="row">
    <button id="bAutoCam" class="on">Auto caméra</button>
    <span class="lbl">tous les</span><input id="camEvery" type="number" min="1" value="32"><span class="lbl">kicks</span>
  </div>
  <div class="row">
    <button id="bAutoFx" class="on">Auto effet</button>
    <span class="lbl">tous les</span><input id="fxEvery" type="number" min="1" value="16"><span class="lbl">kicks</span>
  </div>
  <div class="row"><span class="lbl">Caméra</span><select id="selCam"></select></div>
  <div class="row"><span class="lbl">Micro</span><select id="selMic"></select></div>
  <div class="row"><span class="lbl">Effet</span><select id="selFx"></select></div>
  <div id="hint">Clavier : C caméra · E effet · 1–8 effets · T tap · M miroir · F plein écran · H masquer</div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const FX = ['Zoom pulse', 'RGB split', 'Glitch', 'Flash inversé', 'Kaléidoscope', 'Pixel', 'Posterize couleur', 'Miroir symétrique'];

const S = {
  fx: 0, kick: 0, seed: 0, lastKick: 0, kicks: 0, intervals: [],
  mirror: false, autoCam: true, autoFx: true,
  cams: [], camIdx: 0, video: null, switchToken: 0,
};

/* ---------- WebGL ---------- */
const canvas = $('gl');
const gl = canvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: false });

const VS = `attribute vec2 p; varying vec2 vUv;
void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }`;

const FS = `precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uRes, uVid;
uniform float uTime, uKick, uSeed, uMirror;
uniform int uFx;

float hash(float n){ return fract(sin(n)*43758.5453); }

vec2 cover(vec2 uv){
  float sr = uRes.x/uRes.y;
  float vr = uVid.x/max(uVid.y,1.0);
  vec2 s = sr > vr ? vec2(1.0, vr/sr) : vec2(sr/vr, 1.0);
  uv = (uv-0.5)*s + 0.5;
  if (uMirror > 0.5) uv.x = 1.0 - uv.x;
  return uv;
}
vec3 samp(vec2 uv){ return texture2D(uTex, cover(clamp(uv,0.0,1.0))).rgb; }

vec3 hueRot(vec3 c, float a){
  const vec3 k = vec3(0.57735);
  float ca = cos(a);
  return c*ca + cross(k,c)*sin(a) + k*dot(k,c)*(1.0-ca);
}

void main(){
  vec2 uv = vUv;
  float k = uKick;
  vec3 col;

  if (uFx == 0) {                 // Zoom pulse
    uv = (uv-0.5)*(1.0-0.22*k) + 0.5;
    col = samp(uv) * (1.0+0.35*k);
  } else if (uFx == 1) {          // RGB split
    vec2 d = vec2(0.035*k+0.002, 0.01*k);
    col = vec3(samp(uv+d).r, samp(uv).g, samp(uv-d).b);
  } else if (uFx == 2) {          // Glitch
    float rows = mix(8.0, 40.0, hash(uSeed));
    float row = floor(uv.y*rows);
    float on = step(1.0-0.6*k, hash(row+uSeed));
    uv.x += on*(hash(row*1.7+uSeed)-0.5)*0.35*k;
    vec2 d = vec2(0.025*k*on, 0.0);
    col = vec3(samp(uv+d).r, samp(uv).g, samp(uv-d).b);
    col = mix(col, floor(col*4.0)/4.0, on*k);
  } else if (uFx == 3) {          // Flash inversé
    col = samp(uv);
    col = mix(col, vec3(1.0)-col, smoothstep(0.35,0.65,k));
  } else if (uFx == 4) {          // Kaléidoscope
    float ar = uRes.x/uRes.y;
    vec2 p = uv-0.5; p.x *= ar;
    float r = length(p);
    float a = atan(p.y,p.x) + uTime*0.15 + k*0.6;
    float seg = 6.2831853/6.0;
    a = mod(a, seg); a = abs(a - seg*0.5);
    p = vec2(cos(a), sin(a)) * r * (1.0-0.25*k);
    p.x /= ar;
    col = samp(p+0.5) * (1.0+0.2*k);
  } else if (uFx == 5) {          // Pixel
    float n = mix(160.0, 18.0, k);
    vec2 g = vec2(n*uRes.x/uRes.y, n);
    uv = (floor(uv*g)+0.5)/g;
    col = samp(uv);
  } else if (uFx == 6) {          // Posterize couleur
    col = samp(uv);
    float lv = mix(12.0, 3.0, k);
    col = floor(col*lv)/lv;
    col = hueRot(col, uTime*0.5 + k*2.0) * (1.0+0.3*k);
  } else {                        // Miroir symétrique
    vec2 p = uv; p.x = 0.5 - abs(p.x-0.5);
    p = (p-0.5)*(1.0-0.2*k) + 0.5;
    col = samp(p) * (1.0+0.3*k);
  }

  float v = smoothstep(0.95, 0.3, length(vUv-0.5));
  col *= mix(0.7, 1.0, v);
  gl_FragColor = vec4(clamp(col,0.0,1.0), 1.0);
}`;

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
let prog, U = {}, tex;
function initGL(){
  if (!gl) throw new Error('WebGL non disponible sur ce navigateur.');
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['uTex','uRes','uVid','uTime','uKick','uSeed','uMirror','uFx']) U[n] = gl.getUniformLocation(prog, n);
  tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
  gl.uniform1i(U.uTex, 0);
}
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(innerWidth*dpr), h = Math.round(innerHeight*dpr);
  if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; gl.viewport(0,0,w,h); }
}

/* ---------- Caméras ---------- */
const vids = new Map();
function streamAlive(v){
  const t = v && v.srcObject && v.srcObject.getVideoTracks()[0];
  return t && t.readyState === 'live' && !t.muted;
}
function makeVideo(stream){
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.setAttribute('playsinline',''); v.autoplay = true;
  v.srcObject = stream;
  return v;
}
async function getCamVideo(deviceId){
  let v = vids.get(deviceId);
  if (streamAlive(v)) return v;
  if (v && v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
  const s = await navigator.mediaDevices.getUserMedia({
    video: { deviceId: { exact: deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  if (!v){ v = makeVideo(s); vids.set(deviceId, v); } else v.srcObject = s;
  await v.play().catch(()=>{});
  return v;
}
async function switchCam(i){
  if (!S.cams.length) return;
  i = ((i % S.cams.length) + S.cams.length) % S.cams.length;
  const token = ++S.switchToken;
  try {
    const v = await getCamVideo(S.cams[i].deviceId);
    if (token !== S.switchToken) return;
    S.camIdx = i; S.video = v;
    $('selCam').value = S.cams[i].deviceId;
  } catch(e){ console.warn('Caméra indisponible', e); }
}
function randomOther(n, cur){ if (n < 2) return cur; let r; do { r = Math.floor(Math.random()*n); } while (r === cur); return r; }

/* ---------- Audio / détection du kick ---------- */
let actx, analyser, hp, lp, micSrc, micStream, abuf;
const hist = []; let armed = true, lastRms = 0, lastRatio = 0;

async function startMic(deviceId){
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = await navigator.mediaDevices.getUserMedia({ audio: {
    deviceId: deviceId ? { exact: deviceId } : undefined,
    echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  if (micSrc) micSrc.disconnect();
  micSrc = actx.createMediaStreamSource(micStream);
  micSrc.connect(hp);
}
function initAudio(){
  actx = new (window.AudioContext || window.webkitAudioContext)();
  hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 35;
  lp = actx.createBiquadFilter(); lp.type = 'lowpass';  lp.frequency.value = 140; lp.Q.value = 0.8;
  analyser = actx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0;
  hp.connect(lp); lp.connect(analyser);
  abuf = new Float32Array(analyser.fftSize);
}
function detect(now){
  if (!analyser) return;
  analyser.getFloatTimeDomainData(abuf);
  let s = 0; for (let i = 0; i < abuf.length; i++) s += abuf[i]*abuf[i];
  const rms = Math.sqrt(s/abuf.length);
  hist.push([now, rms]);
  while (hist.length && now - hist[0][0] > 800) hist.shift();
  let avg = 0; for (const h of hist) avg += h[1]; avg /= hist.length;
  const ratio = rms / (avg + 1e-6);
  lastRatio = ratio;
  const sens = +$('sens').value;
  // Déclenche au franchissement du seuil, se réarme quand le niveau redescend
  if (armed && ratio > sens && rms > 0.0002 && now - S.lastKick > 140){ kick(now); armed = false; }
  else if (ratio < 1 + (sens - 1) * 0.5) armed = true;
  lastRms = rms;
}
function kick(now){
  now = now || performance.now();
  S.kick = 1; S.seed = Math.random()*1000;
  if (S.lastKick){
    const iv = now - S.lastKick;
    if (iv > 250 && iv < 1500){ S.intervals.push(iv); if (S.intervals.length > 12) S.intervals.shift(); }
  }
  S.lastKick = now; S.kicks++;
  const ce = Math.max(1, +$('camEvery').value|0), fe = Math.max(1, +$('fxEvery').value|0);
  if (S.autoCam && S.kicks % ce === 0) switchCam(randomOther(S.cams.length, S.camIdx));
  if (S.autoFx && S.kicks % fe === 0) setFx(randomOther(FX.length, S.fx));
  const d = $('dot'); d.classList.add('hit'); setTimeout(() => d.classList.remove('hit'), 70);
}
function bpm(){
  if (S.intervals.length < 4) return null;
  const a = [...S.intervals].sort((x,y) => x-y);
  return Math.round(60000 / a[a.length >> 1]);
}

/* ---------- Boucle ---------- */
let lastT = performance.now(), t0 = lastT, uiTick = 0;
function frame(now){
  const dt = now - lastT; lastT = now;
  detect(now);
  const dur = +$('dur').value;
  S.kick *= Math.exp(-dt*3/dur);
  resize();
  const v = S.video;
  if (v && v.readyState >= 2 && v.videoWidth){
    gl.bindTexture(gl.TEXTURE_2D, tex);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, v); } catch(e){}
    gl.uniform2f(U.uVid, v.videoWidth, v.videoHeight);
  } else gl.uniform2f(U.uVid, 16, 9);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, (now - t0)/1000);
  gl.uniform1f(U.uKick, Math.min(1.5, S.kick * +$('amt').value));
  gl.uniform1f(U.uSeed, S.seed);
  gl.uniform1f(U.uMirror, S.mirror ? 1 : 0);
  gl.uniform1i(U.uFx, S.fx);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  if (++uiTick % 4 === 0 && !$('ui').hidden){
    const sens = +$('sens').value, max = 3.5;
    $('meterFill').style.width = Math.min(100, lastRatio/max*100) + '%';
    $('meterFill').style.background = lastRatio > sens ? 'var(--acc)' : '#5ad1a0';
    $('meterThr').style.left = (sens/max*100) + '%';
    const b = bpm();
    const cam = S.cams[S.camIdx];
    $('status').textContent = `${b ? b + ' BPM' : '— BPM'} · basses ${(lastRms*1000).toFixed(1)} ·${FX[S.fx]} · ${cam ? (cam.label || 'Caméra ' + (S.camIdx+1)) : 'pas de caméra'} · ${S.kicks} kicks`;
  }
  requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
function setFx(i){ S.fx = ((i % FX.length) + FX.length) % FX.length; $('selFx').value = S.fx; }
function toggleUi(force){
  const hide = force !== undefined ? force : !$('ui').hidden;
  $('ui').hidden = hide; $('showUi').hidden = !hide;
}
async function fullscreen(){
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch(e){}
}
function bindSlider(id, fmt){ const f = () => $(id+'V').textContent = fmt($(id).value); $(id).addEventListener('input', f); f(); }

function setupUi(){
  FX.forEach((n,i) => $('selFx').add(new Option(`${i+1}. ${n}`, i)));
  bindSlider('sens', v => '×' + (+v).toFixed(2));
  bindSlider('amt', v => (+v).toFixed(2));
  bindSlider('dur', v => v);
  $('bCam').onclick = () => switchCam(S.camIdx + 1);
  $('bFx').onclick = () => setFx(S.fx + 1);
  $('bTap').onclick = () => kick();
  $('bMirror').onclick = () => { S.mirror = !S.mirror; $('bMirror').classList.toggle('on', S.mirror); };
  $('bFull').onclick = fullscreen;
  $('bHide').onclick = () => toggleUi(true);
  $('showUi').onclick = () => toggleUi(false);
  $('bAutoCam').onclick = () => { S.autoCam = !S.autoCam; $('bAutoCam').classList.toggle('on', S.autoCam); };
  $('bAutoFx').onclick = () => { S.autoFx = !S.autoFx; $('bAutoFx').classList.toggle('on', S.autoFx); };
  $('selCam').onchange = e => switchCam(S.cams.findIndex(c => c.deviceId === e.target.value));
  $('selFx').onchange = e => setFx(+e.target.value);
  $('selMic').onchange = e => startMic(e.target.value).catch(err => console.warn(err));
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    const k = e.key.toLowerCase();
    if (k === 'c') switchCam(S.camIdx + 1);
    else if (k === 'e') setFx(S.fx + 1);
    else if (k === 't') kick();
    else if (k === 'm') $('bMirror').click();
    else if (k === 'f') fullscreen();
    else if (k === 'h') toggleUi();
    else if (k >= '1' && k <= String(FX.length)) setFx(+k - 1);
  });
}

async function start(){
  $('err').textContent = '';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    throw new Error("Accès caméra/micro impossible ici. Ouvre la page dans Chrome sur Mac, ou via http://localhost.");
  initGL();
  initAudio();
  await actx.resume();

  // Permission caméra (on garde ce premier flux)
  const first = await navigator.mediaDevices.getUserMedia({ video: { width:{ideal:1920}, height:{ideal:1080} }, audio: false });
  await startMic();

  const devs = await navigator.mediaDevices.enumerateDevices();
  S.cams = devs.filter(d => d.kind === 'videoinput');
  const mics = devs.filter(d => d.kind === 'audioinput');
  S.cams.forEach((c,i) => $('selCam').add(new Option(c.label || 'Caméra ' + (i+1), c.deviceId)));
  mics.forEach((m,i) => $('selMic').add(new Option(m.label || 'Micro ' + (i+1), m.deviceId)));
  const curMic = micStream.getAudioTracks()[0].getSettings().deviceId;
  if (curMic) $('selMic').value = curMic;

  const firstId = first.getVideoTracks()[0].getSettings().deviceId;
  const v = makeVideo(first); await v.play().catch(()=>{});
  let idx = S.cams.findIndex(c => c.deviceId === firstId);
  if (idx < 0){ idx = 0; if (S.cams[0]) vids.set(S.cams[0].deviceId, v); } else vids.set(firstId, v);
  S.camIdx = idx; S.video = v;
  if (S.cams[idx]) $('selCam').value = S.cams[idx].deviceId;

  try { await navigator.wakeLock?.request('screen'); } catch(e){}
  $('start').hidden = true; $('start').style.display = 'none';
  toggleUi(false);
  requestAnimationFrame(frame);
}

setupUi();
$('go').onclick = () => start().catch(e => {
  console.error(e);
  $('err').textContent = (e && e.name === 'NotAllowedError')
    ? "Autorisation caméra/micro refusée. Autorise-les dans le navigateur puis recharge la page."
    : (e.message || String(e));
});
})();
</script>
</body>
</html>
